# Weekly version updates for the workflow actions and the npm packages used
# for testing and building. Each ecosystem gets one grouped pull request into
# development; it is merged by hand like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule: { interval: weekly, day: monday }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule: { interval: weekly, day: monday }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/engines-build/whisper"
    target-branch: development
    schedule: { interval: weekly, day: monday }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/engines-build/sherpa"
    target-branch: development
    schedule: { interval: weekly, day: monday }
    groups: { all: { patterns: ["*"] } }
