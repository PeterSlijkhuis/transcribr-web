# .github/workflows/deploy-pages.yml
name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # webkit is Safari's engine; together these cover Chrome, Edge,
        # Firefox and Safari.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore cached browser profile (holds the ~275MB engine download)
        uses: actions/cache@v4
        with:
          path: .playwright-profile-${{ matrix.browser }}
          key: playwright-profile-${{ matrix.browser }}-${{ hashFiles('engines/manifest.json') }}

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Unit tests
        run: npm test

      - name: End-to-end check (real engines from Hugging Face, real fixture audio)
        run: npm run e2e
        env:
          BROWSER: ${{ matrix.browser }}

  deploy:
    needs: test
    # push to master, or a manual run on master (re-running a failed deploy job
    # inside the same run fails: its github-pages artifact already exists).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the static app (not engines-build/, docs/ or test/)
        run: |
          mkdir -p _site
          cp index.html bench.html styles.css *.js NOTICE.md _site/
          cp -r engines export logos _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
