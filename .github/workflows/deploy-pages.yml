# .github/workflows/deploy-pages.yml
name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # webkit is Safari's engine; together these cover Chrome, Edge,
        # Firefox and Safari.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore cached browser profile (holds the ~275MB engine download)
        uses: actions/cache@v6
        with:
          path: .playwright-profile-${{ matrix.browser }}
          key: playwright-profile-${{ matrix.browser }}-${{ hashFiles('engines/manifest.json') }}

      - name: Restore cached Playwright browsers (Firefox alone takes ~3 min to download)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ matrix.browser }}-${{ hashFiles('package.json') }}

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Unit tests
        run: npm test

      - name: End-to-end check (real engines from Hugging Face, real fixture audio)
        run: npm run e2e
        env:
          BROWSER: ${{ matrix.browser }}

  deploy:
    needs: test
    # push to master, or a manual run on master (re-running a failed deploy job
    # inside the same run fails: its github-pages artifact already exists).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the static app (not engines-build/, docs/ or test/)
        run: |
          mkdir -p _site
          cp index.html bench.html styles.css *.js NOTICE.md _site/
          cp -r engines export logos _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub bug (actions/deploy-pages#451): deploy-pages looks the artifact
      # up once and it may not be listed yet right after the upload, so it
      # fails with "No artifacts named github-pages". Retry only the deploy:
      # a second upload would leave two artifacts and fail the lookup too.
      # Remove the retries once a fixed deploy-pages is released.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 5

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment_retry_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 3)
        id: deployment_retry_3
        if: steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
